<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="
      Descubre camisetas básicas y oversize confeccionadas en Colombia, con diseños DTF originales para darle vida a tu estilo.
      Prendas pensadas para acompañarte todos los días, combinando comodidad, calidad y personalidad."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&display=swap"
      rel="stylesheet"
    />

    <!-- Tipografia principal del sistema (Albert Sans, como la plantilla Sabina) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- Tipografia del titular del hero (display) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&display=swap"
      rel="stylesheet"
    />

    <!-- Tipografias de apoyo usadas por los estilos heredados -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Tema claro/oscuro: se resuelve ANTES de que React monte para evitar el
      "flash" de tema incorrecto. La misma clave (bygio_theme) la usa
      src/tema/TemaProvider.jsx, que se encarga de los cambios en tiempo real.
    -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem("bygio_theme");
          var prefiereOscuro =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var tema =
            guardado === "light" || guardado === "dark"
              ? guardado
              : prefiereOscuro
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", tema);
          document.documentElement.style.colorScheme = tema;
        } catch (error) {
          /* Sin acceso a localStorage: se usa el tema claro por defecto. */
        }
      })();
    </script>

    <title>ByGio · Moda femenina y diseños DTF</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
